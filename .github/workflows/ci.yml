
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid cancelling a workflow while a database migration is running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================
  # BACKEND QUALITY & INTEGRATION TESTS
  # ============================================
  backend:
    name: Backend (lint, types, unit, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        working-directory: backend
        run: uv run mypy

      - name: Unit tests
        working-directory: backend
        run: uv run pytest

      - name: Install Tesseract (OCR tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Start infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis minio

      # This migration targets the temporary CI database,
      # NOT the production database.
      - name: Migrate and bootstrap test storage
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run documind-manage bootstrap-storage

      - name: Integration tests
        working-directory: backend
        run: uv run pytest -m integration

      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color

  # ============================================
  # FRONTEND QUALITY & BUILD
  # ============================================
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # ============================================
  # DOCKER IMAGE BUILDS
  # ============================================
  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build backend (dev and runtime)
        run: |
          docker build --target dev \
            -t documind-backend:dev backend

          docker build --target runtime \
            -t documind-backend:runtime backend

      - name: Build frontend (dev and build)
        run: |
          docker build --target dev \
            -t documind-frontend:dev frontend

          docker build --target build \
            -t documind-frontend:build frontend

  # ============================================
  # PRODUCTION DATABASE MIGRATIONS
  # ============================================
  production-migrate:
    name: Production Database Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Production migrations run only after all checks pass.
    needs:
      - backend
      - frontend
      - images

    # Never migrate production from a pull request
    # or a non-main branch.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    # Configure this GitHub Environment with optional
    # required reviewers for production approval.
    environment: production

    # Serialize production database migrations.
    concurrency:
      group: documind-production-migrations
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Validate production database configuration
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL secret is missing."
            exit 1
          fi

          case "$DATABASE_URL" in
            postgresql://*|postgres://*)
              echo "Production database URL configuration is valid."
              ;;
            *)
              echo "::error::Invalid PostgreSQL connection URL."
              exit 1
              ;;
          esac

      - name: Apply production database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "Applying production Alembic migrations..."

          uv run alembic upgrade head

          echo "Production database migration completed."

      - name: Verify production migration revision
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          uv run alembic current
