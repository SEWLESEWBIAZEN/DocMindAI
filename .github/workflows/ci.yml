name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Lint
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        working-directory: backend
        run: uv run mypy
      - name: Unit tests
        working-directory: backend
        run: uv run pytest
      - name: Install Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Start infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis minio
      - name: Migrate and bootstrap storage
        working-directory: backend
        run: uv run alembic upgrade head && uv run documind-manage bootstrap-storage
      - name: Integration tests
        working-directory: backend
        run: uv run pytest -m integration
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend (dev and runtime)
        run: |
          docker build --target dev -t documind-backend:dev backend
          docker build --target runtime -t documind-backend:runtime backend
      - name: Build frontend (dev and build)
        run: |
          docker build --target dev -t documind-frontend:dev frontend
          docker build --target build -t documind-frontend:build frontend
