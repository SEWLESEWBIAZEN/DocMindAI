[project]
name = "documind"
version = "0.1.0"
description = "DocuMind AI backend: multi-tenant document intelligence API."
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "celery>=5.4",
    "cryptography>=44",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "openai>=1.60",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "pymupdf>=1.25,<2",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
documind-manage = "documind.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# Integration tests need the Docker Compose infrastructure; run them with
# `uv run pytest -m integration`.
addopts = ["-ra", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: requires running PostgreSQL, Redis and S3-compatible storage",
]
filterwarnings = [
    "error::DeprecationWarning:documind.*",
    # Starlette recommends a different HTTP client for TestClient; tracked in
    # docs/IMPLEMENTATION_STATUS.md. Remove once the test client is migrated.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT", "T20",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/documind", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "celery.*", "kombu.*"]
ignore_missing_imports = true

# Test fixtures are built with untyped PyMuPDF / python-docx APIs.
[[tool.mypy.overrides]]
module = ["tests.unit.test_extractors",
    "tests.unit.test_figures", "tests.integration.test_processing_pipeline"]
disallow_untyped_calls = false
warn_return_any = false
