# DocuMind AI - local development stack.
#
#   cp .env.example .env
#   docker compose up --build
#
# Every published port is bound to 127.0.0.1. This file is for development
# only; the production configuration is a separate file (Phase 10).

name: documind

x-backend-environment: &backend-environment
  ENVIRONMENT: development
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  # Download links are opened by the browser, which can't resolve "minio".
  S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_API_HOST_PORT:-9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set in .env}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
  S3_BUCKET: ${S3_BUCKET:?set in .env}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in .env}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set in .env}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  EMAIL_FROM: ${EMAIL_FROM:-DocuMind AI <no-reply@documind.local>}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  LLM_PROVIDER: ${LLM_PROVIDER:-local}
  SPEECH_PROVIDER: ${SPEECH_PROVIDER:-none}
  FIGURE_DESCRIPTIONS_ENABLED: ${FIGURE_DESCRIPTIONS_ENABLED:-false}
  LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      # Lets redis-cli authenticate without putting the password in argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # The upstream minio/minio image is no longer published on Docker Hub.
    # See docs/adr/0006-local-object-storage-image.md before changing this.
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MINIO_BROWSER: "on"
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    # Development mail catcher: every email the app sends lands here.
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    image: documind-backend
    environment: *backend-environment
    # Development convenience: apply migrations and create the bucket on start.
    # Production runs these as explicit deployment steps instead.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        documind-manage bootstrap-storage &&
        exec uvicorn documind.asgi:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=4).status != 200)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # Document processing (extraction, OCR, chunking, embeddings).
  worker:
    build:
      context: ./backend
      target: dev
    image: documind-backend
    environment: *backend-environment
    command:
      - celery
      - -A
      - documind.worker.celery_app
      - worker
      - -Q
      - documents
      - --concurrency
      - "2"
      - --loglevel
      - INFO
    volumes:
      - ./backend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy  # migrations have run
    healthcheck:
      test: ["CMD-SHELL", "celery -A documind.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    # Warm shutdown: let in-flight jobs finish (acks_late re-delivers otherwise).
    stop_grace_period: 60s
    restart: unless-stopped

  # Schedules the recovery sweep (re-dispatch lost jobs, recover crashed workers).
  beat:
    image: documind-backend
    environment: *backend-environment
    command:
      - celery
      - -A
      - documind.worker.celery_app
      - beat
      - --loglevel
      - INFO
      - --schedule
      - /tmp/celerybeat-schedule
    volumes:
      - ./backend/src:/app/src
    depends_on:
      worker:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
