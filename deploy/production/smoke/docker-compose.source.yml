# Sandbox fallback only: when base images can't be pulled to rebuild documind-backend:runtime,
# run the current source on the last built image (same dependencies). Not for real deployments.
# Paths are relative to deploy/production (the first Compose file's directory).
x-source: &source
  - ../../backend/src/documind:/opt/venv/lib/python3.12/site-packages/documind:ro
  - ../../backend/alembic:/app/alembic:ro
  - ../../backend/alembic_dataplane:/app/alembic_dataplane:ro
  - ../../backend/alembic.ini:/app/alembic.ini:ro
  - ./smoke/work/ca.pem:/smoke/ca.pem:ro
services:
  migrate: { volumes: *source }
  api: { volumes: *source }
  worker: { volumes: *source }
  beat: { volumes: *source }
  backup: { volumes: *source }
  openai-stub:
    volumes:
      - ../../backend/src/documind:/opt/venv/lib/python3.12/site-packages/documind:ro
      - ./smoke/openai_stub.py:/smoke/openai_stub.py:ro
