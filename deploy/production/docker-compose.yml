# DocuMind production stack (Phase 10). See docs/runbooks/deployment.md.
#
#   cp .env.example .env && ./generate-secrets.sh >> .env   # then edit .env
#   docker compose --profile bundled-db --profile letsencrypt --profile backup up -d
#
# Leave out "bundled-db" when using a managed PostgreSQL (recommended).
# Only the web proxy publishes ports (80/443); everything else is on an internal
# network. Application containers run as a non-root user, with a read-only root
# filesystem and no Linux capabilities.

x-app: &app
  image: ${DOCUMIND_IMAGE:-documind-backend:runtime}
  build:
    context: ../../backend
    target: runtime
  env_file: ${DOCUMIND_ENV_FILE:-.env}
  environment: &app-env
    ENVIRONMENT: production
    LOG_FORMAT: json
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    AUTH_COOKIE_SECURE: "true"
    PUBLIC_APP_URL: https://${SERVER_NAME}
    CORS_ALLOWED_ORIGINS: https://${SERVER_NAME}
  read_only: true
  tmpfs:
    - /tmp:size=512m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  # internal: Redis and PostgreSQL; egress: AI providers, S3, SMTP, customer databases.
  networks: [internal, egress]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  web:
    image: ${DOCUMIND_WEB_IMAGE:-documind-web:runtime}
    build:
      context: ../../frontend
      target: runtime
      additional_contexts:
        deploy-nginx: ./nginx
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME}
      API_UPSTREAM: api:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/nginx/certs
      - acme:/var/www/acme
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal, public]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  certbot:
    image: certbot/certbot:v3.0.1
    entrypoint: ["/bin/sh", "/certbot.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-false}
    volumes:
      - ./certbot.sh:/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/acme
    restart: unless-stopped
    networks: [public]
    profiles: [letsencrypt]

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && documind-manage bootstrap-storage && documind-manage dataplanes migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false  # only with the bundled-db profile

  api:
    <<: *app
    command:
      - sh
      - -c
      - exec uvicorn documind.asgi:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-3} --proxy-headers --forwarded-allow-ips '*' --no-access-log --timeout-graceful-shutdown 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["celery", "-A", "documind.worker.celery_app", "worker", "-Q", "documents", "--concurrency", "${WORKER_CONCURRENCY:-2}", "--loglevel", "INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A documind.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    command: ["celery", "-A", "documind.worker.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  # Optional: PostgreSQL inside this stack. Prefer a managed PostgreSQL 16 with
  # pgvector: point DATABASE_URL at it and leave this profile off.
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256m
    restart: unless-stopped
    networks: [internal]
    profiles: [bundled-db]

  # Encrypted daily backups with an offsite copy (docs/runbooks/backup-and-restore.md).
  backup:
    <<: *app
    image: ${DOCUMIND_BACKUP_IMAGE:-documind-backend:backup}
    build:
      context: ../../backend
      target: backup
      additional_contexts:
        backup-scripts: ../../infra/backup
    read_only: false
    environment:
      <<: *app-env
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
    secrets: [backup_passphrase]
    volumes:
      - backups:/backups
    healthcheck:
      disable: true
    profiles: [backup]

secrets:
  backup_passphrase:
    file: ./secrets/backup_passphrase

volumes:
  letsencrypt:
  acme:
  redis-data:
  postgres-data:
  backups:

networks:
  internal:
    internal: true
  egress:
  public:
